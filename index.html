<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIsland 🏝️ — Aprende Lengua de Señas</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <!-- Raycast acelerado para colisiones contra la malla del escenario -->
    <script src="https://unpkg.com/three-mesh-bvh@0.7.8/build/index.umd.cjs"></script>

    <!-- Nombre único del jugador, compartido por todos los componentes -->
    <script>
      window.PLAYER_NAME = "Isleño-" + Math.floor(1000 + Math.random() * 9000);
    </script>

    <script src="components/npc-dialog.js"></script>
    <script src="components/world-builder.js"></script>
    <script src="components/inventory.js"></script>
    <script src="components/sign-lesson.js"></script>
    <script src="components/video-screen.js"></script>
    <script src="components/cartesian-grid.js"></script>
    <script src="components/collision-wall.js"></script>
    <script src="components/video-map.js"></script>
    <script src="components/player-avatar.js"></script>

    <!-- Multijugador NAF + audio espacial (socket.io lo sirve el servidor Node.js) -->
    <script src="https://cdn.jsdelivr.net/npm/networked-aframe@0.12.1/dist/networked-aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="components/network.js"></script>
    <script src="components/chat.js"></script>
    <script src="components/webcam.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 100;
        font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      }

      #instructions {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        color: #fff;
        padding: 10px 22px;
        border-radius: 30px;
        font-size: 13px;
        letter-spacing: 0.5px;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        background: #0a1628;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease;
        font-family: "Segoe UI Emoji", sans-serif;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loading-screen h1 {
        color: #7ee8a2;
        font-size: 2.5rem;
        margin-bottom: 8px;
      }

      #loading-screen p {
        color: #aaa;
        font-size: 1rem;
        margin-bottom: 32px;
      }

      .loader-bar {
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
      }

      .loader-fill {
        height: 100%;
        background: linear-gradient(90deg, #7ee8a2, #38bdf8);
        border-radius: 4px;
        animation: load 2s ease forwards;
      }

      @keyframes load {
        from {
          width: 0%;
        }
        to {
          width: 100%;
        }
      }

      #npc-hint {
        position: fixed;
        top: 188px;
        right: 20px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        color: #fff;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }

      #npc-hint.visible {
        opacity: 1;
      }

      #minimap {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 120px;
        height: 120px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #aaa;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
      }

      #minimap canvas {
        width: 100px;
        height: 100px;
        border-radius: 8px;
      }

      /* ─── Chat de texto ─── */
      #chat {
        position: fixed;
        bottom: 70px;
        left: 20px;
        width: 340px;
        max-width: 60vw;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0.2;
        transition: opacity 0.4s ease;
        pointer-events: none;
        z-index: 150;
        font-family: "Segoe UI", sans-serif;
      }

      #chat-log {
        max-height: 180px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 8px 12px;
        color: #fff;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      #chat-log:empty {
        display: none;
      }

      .chat-name {
        color: #7ee8a2;
        font-weight: 600;
      }

      .chat-name.me {
        color: #38bdf8;
      }

      #chat-input {
        display: none;
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(126, 232, 162, 0.55);
        border-radius: 20px;
        padding: 8px 16px;
        color: #fff;
        font-size: 13px;
        outline: none;
      }
    </style>
  </head>

  <body>
    <div id="loading-screen">
      <h1>🏝️ SignIsland</h1>
      <p>Bienvenido a la isla donde todos hablan con las manos</p>
      <div class="loader-bar">
        <div class="loader-fill"></div>
      </div>
    </div>

    <div id="hud">
      <div id="instructions">
        WASD mover &nbsp;·&nbsp; Shift correr &nbsp;·&nbsp; Q cambiar vista
        &nbsp;·&nbsp; E interactuar &nbsp;·&nbsp; B emotes &nbsp;·&nbsp; F
        bailar juntos &nbsp;·&nbsp; T chat &nbsp;·&nbsp; C cámara &nbsp;·&nbsp;
        G rejilla &nbsp;·&nbsp; Esc cerrar
      </div>

      <!-- Chat de texto (T para abrir) -->
      <div id="chat">
        <div id="chat-log"></div>
        <input
          id="chat-input"
          type="text"
          maxlength="200"
          placeholder="Escribe un mensaje y pulsa Enter…"
          autocomplete="off"
        />
      </div>
      <!-- Vista propia de la cámara (lengua de señas) — esquina superior derecha -->
      <div
        id="self-cam"
        style="
          display: none;
          position: fixed;
          top: 16px;
          right: 16px;
          width: 180px;
          border-radius: 12px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.18);
          background: rgba(0, 0, 0, 0.55);
          backdrop-filter: blur(8px);
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
          z-index: 180;
          pointer-events: none;
        "
      >
        <video
          id="self-cam-video"
          autoplay
          playsinline
          muted
          style="
            display: block;
            width: 100%;
            height: 135px;
            object-fit: cover;
            transform: scaleX(-1);
            background: #000;
          "
        ></video>
        <div
          style="
            position: absolute;
            bottom: 6px;
            left: 8px;
            color: #fff;
            font-size: 11px;
            font-family: &quot;Segoe UI&quot;, sans-serif;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
          "
        >
          📹 Tú
        </div>
      </div>

      <div id="npc-hint">👆 Presiona <strong>E</strong> para hablar</div>
      <div id="minimap"><canvas id="minimap-canvas"></canvas></div>

      <div
        id="player-count"
        style="
          position: fixed;
          top: 20px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0, 0, 0, 0.55);
          backdrop-filter: blur(8px);
          color: #fff;
          padding: 6px 16px;
          border-radius: 20px;
          font-size: 12px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          pointer-events: none;
        "
      >
        👥 1 jugador
      </div>

      <button
        id="cam-toggle"
        style="
          position: fixed;
          bottom: 70px;
          right: 20px;
          background: rgba(0, 0, 0, 0.65);
          backdrop-filter: blur(8px);
          border: 1px solid rgba(255, 255, 255, 0.15);
          color: #fff;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          font-size: 18px;
          cursor: pointer;
          pointer-events: auto;
          z-index: 200;
        "
        title="Activar/desactivar cámara (C)"
      >
        📷
      </button>
    </div>

    <!-- Template del avatar remoto (multijugador NAF) -->
    <template id="avatar-template">
      <a-entity player-info follow-rotation>
        <!-- Modelo del personaje remoto -->
        <a-entity
          class="avatar-anim"
          gltf-model="#character-model"
          animation-mixer="clip: Idle; loop: repeat; crossFadeDuration: 0.3"
          scale="1 1 1"
          shadow="cast: true"
        ></a-entity>
        <!-- Nombre sobre la cabeza -->
        <a-text
          class="avatar-name"
          value="Jugador"
          position="0 3 0"
          align="center"
          color="#fff"
          width="3"
          shader="flat"
        ></a-text>
        <a-entity networked-audio-source></a-entity>
        <!-- Panel de cámara (lengua de señas) sobre el avatar remoto. -->
        <a-entity class="peer-cam" cam-panel position="0 2 0"></a-entity>
      </a-entity>
    </template>

    <a-scene
      keyboard-shortcuts="enterVR: false"
      networked-scene="
      room: signisland-island;
      adapter: socketio;
      serverURL: /;
      audio: true;
      debug: false;
      connectOnLoad: true
    "
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      shadow="type: pcfsoft"
      fog="type: exponential; color: #cfe3f5; density: 0.006"
      loading-screen="dotsColor: #7ee8a2; backgroundColor: #0a1628"
    >
      <!-- timeout alto: scene.glb pesa ~127 MB y por WiFi tarda en otros equipos -->
      <a-assets timeout="600000">
        <a-asset-item
          id="scene-model"
          src="assets/models/scene.glb"
        ></a-asset-item>
        <a-asset-item
          id="character-model"
          src="assets/models/character.glb"
        ></a-asset-item>
      </a-assets>

      <!-- Cielo diurno: color base de respaldo + degradado procedural encima -->
      <a-sky color="#bfe0ff"></a-sky>
      <a-entity gradient-sky></a-entity>

      <!-- Sol -->
      <a-sphere
        position="120 210 -360"
        radius="22"
        color="#fff6d8"
        shader="flat"
        emissive="#fff2c0"
        emissive-intensity="0.6"
        segments-height="16"
        segments-width="16"
      ></a-sphere>

      <!-- Halo suave alrededor del sol -->
      <a-sphere
        position="120 210 -360"
        radius="40"
        color="#fff2c0"
        shader="flat"
        material="transparent: true; opacity: 0.12; side: back"
        segments-height="8"
        segments-width="8"
      ></a-sphere>

      <!-- Luz de cielo/suelo (hemisférica) para iluminación diurna suave -->
      <a-light
        type="hemisphere"
        color="#cfe6ff"
        ground-color="#5a6b48"
        intensity="1.0"
      ></a-light>

      <!-- Luz solar direccional cálida -->
      <a-light
        type="directional"
        color="#fff4e0"
        intensity="1.6"
        position="120 210 -360"
        cast-shadow="true"
        shadow-camera-left="-80"
        shadow-camera-right="80"
        shadow-camera-top="80"
        shadow-camera-bottom="-80"
      >
      </a-light>

      <!-- ═══════════ MUNDO (modelo GLB completo) ═══════════ -->
      <!-- animation-mixer reproduce la animación "animated" embebida en el GLB. -->
      <a-entity
        id="world"
        gltf-model="#scene-model"
        animation-mixer="clip: animated; loop: repeat; crossFadeDuration: 0"
        shadow="cast: true; receive: true"
      >
      </a-entity>

      <!-- ═══════════ PANTALLAS DE VIDEO ═══════════ -->
      <!-- Se generan desde components/video-map.js (objeto VIDEO_SCREENS).
           Edita ese archivo para mover/añadir TVs. Acércate y pulsa E. -->

      <!-- Plano cartesiano de referencia (rejilla + ejes X/Y/Z).
           Alterna desde código con toggleGrid() o con la tecla G. -->
      <a-entity id="grid" cartesian-grid visible="false"></a-entity>

      <!-- ═══════════ MUROS DE COLISIÓN INVISIBLES ═══════════ -->
      <!-- Cubos invisibles que bloquean al jugador. Se vuelven rojos al
           activar la rejilla (tecla G) para poder ubicarlos y ajustarlos.
           Define el tamaño con width/height/depth y la posición con position.
           Duplica esta línea para añadir más muros: -->
      <!--
      <a-collision-wall width="4" height="5" depth="0.5"
                        position="0 2.5 -10"></a-collision-wall>
      -->
      <a-entity id="collision-walls">
        <a-collision-wall
          width="1"
          height="1"
          depth="276"
          position="47 0 -123"
        ></a-collision-wall>
        <a-collision-wall
          width="117"
          height="1"
          depth="1"
          position="-11.5 0 -261"
        ></a-collision-wall>
        <a-collision-wall
          width="2"
          height="1"
          depth="228"
          position="-72 0 -147"
        ></a-collision-wall>
        <a-collision-wall
          width="1"
          height="1"
          depth="26"
          position="-175 0 -47"
        ></a-collision-wall>
        <a-collision-wall
          width="62"
          height="1"
          depth="1"
          position="-206 0 -60"
        ></a-collision-wall>
        <a-collision-wall
          width="1"
          height="1"
          depth="71"
          position="-237 0 -24.5"
        ></a-collision-wall>
        <a-collision-wall
          width="69"
          height="1"
          depth="1"
          position="-202.5 0 11"
        ></a-collision-wall>
        <a-collision-wall
          width="1"
          height="1"
          depth="33"
          position="-168 0 -5.5"
        ></a-collision-wall>
        <a-collision-wall
          width="3"
          height="1"
          depth="42"
          position="-70 0 -1"
        ></a-collision-wall>
        <a-collision-wall
          width="28"
          height="1"
          depth="3"
          position="-56 0 20"
        ></a-collision-wall>
        <a-collision-wall
          width="3"
          height="1"
          depth="39"
          position="-38 0 0.5"
        ></a-collision-wall>
        <a-collision-wall
          width="13"
          height="1"
          depth="0.25"
          position="-44.5 0 -19.2"
        ></a-collision-wall>
        <a-collision-wall
          width="13.5"
          height="1"
          depth="0.25"
          position="-63.25 0 -19.2"
        ></a-collision-wall>
        <a-collision-wall
          width="85"
          height="1"
          depth="1"
          position="4.5 0 15"
        ></a-collision-wall>
      </a-entity>

      <!-- ═══════════ ACADEMIA ═══════════ -->
      <a-entity id="academia-building" position="-53.5 0 2" rotation="0 180 0">
        <!-- ──── PIZARRÓN (interfaz inmersiva de lecciones) ──── -->
        <a-entity id="pizarron" academia="range: 12" position="0 0 0">
          <!-- Marco de madera -->
          <a-box
            width="5.6"
            height="3.9"
            depth="0.14"
            color="#5c3315"
            position="0 2.5 -0.01"
            shadow="cast: true"
          ></a-box>

          <!-- Superficie del pizarrón (verde pizarra) -->
          <a-plane
            id="pizarron-surface"
            width="5"
            height="3.4"
            color="#1a3d1a"
            position="0 2.5 0.07"
          ></a-plane>

          <!-- Bandeja portaltizas -->
          <a-box
            width="5.4"
            height="0.11"
            depth="0.2"
            color="#7a5c3a"
            position="0 0.88 0.07"
            shadow="cast: true"
          ></a-box>

          <!-- Tizas decorativas -->
          <a-box
            width="0.28"
            height="0.06"
            depth="0.08"
            color="#f0ece0"
            position="1.8  0.96 0.11"
          ></a-box>
          <a-box
            width="0.22"
            height="0.06"
            depth="0.08"
            color="#f0ddd0"
            position="-1.5 0.96 0.11"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- ═══════════ JUGADOR ═══════════ -->
      <a-entity
        id="player"
        position="-43.8 0 -3"
        player-avatar
        player-info
        networked="template: #avatar-template; attachTemplateToLocal: false"
      >
        <!-- Modelo 3D del personaje — oculto en 1ra persona, visible en 3ra -->
        <a-entity
          id="player-model"
          class="avatar-anim"
          gltf-model="#character-model"
          animation-mixer="clip: Idle; loop: repeat; crossFadeDuration: 0.3"
          position="0 0 0"
          rotation="0 180 0"
          scale="1 1 1"
          shadow="cast: true"
          visible="false"
        >
        </a-entity>

        <!-- Panel de cámara propio (visible en 3ra persona y para los demás). -->
        <a-entity cam-panel="self: true" position="0 2 0"></a-entity>

        <!-- Pivote de cámara: look-controls orbita alrededor del jugador.
           En 3ra persona la cámara se desplaza hacia atrás (player-avatar). -->
        <a-entity
          id="cam-pivot"
          position="0 1 0"
          look-controls="pointerLockEnabled: true"
        >
          <a-camera
            id="camera"
            position="0 1 0"
            look-controls="enabled: false"
            wasd-controls="enabled: false"
          >
            <a-entity
              cursor="rayOrigin: mouse; fuse: false"
              raycaster="objects: [npc-dialog]; near: 0; far: 7"
              position="0 0 -1"
              geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.013"
              material="color: white; shader: flat; opacity: 0.8"
            ></a-entity>
          </a-camera>
        </a-entity>
      </a-entity>
    </a-scene>

    <script src="components/scene-logic.js"></script>

    <script>
      // Cielo diurno con degradado vertical (cenit → horizonte).
      // Esfera grande con BackSide y un shader sencillo; sin dependencias extra.
      AFRAME.registerComponent("gradient-sky", {
        schema: {
          top: { type: "color", default: "#2a7fd4" },
          bottom: { type: "color", default: "#dff1ff" },
          offset: { type: "number", default: 180 },
          exponent: { type: "number", default: 0.8 },
        },
        init() {
          const geo = new THREE.SphereGeometry(990, 32, 15);
          const mat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            fog: false,
            uniforms: {
              topColor: { value: new THREE.Color(this.data.top) },
              bottomColor: { value: new THREE.Color(this.data.bottom) },
              offset: { value: this.data.offset },
              exponent: { value: this.data.exponent },
            },
            vertexShader: `
              varying vec3 vWorldPosition;
              void main() {
                vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform vec3 topColor;
              uniform vec3 bottomColor;
              uniform float offset;
              uniform float exponent;
              varying vec3 vWorldPosition;
              void main() {
                float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
                float f = pow(max(h, 0.0), exponent);
                gl_FragColor = vec4(mix(bottomColor, topColor, f), 1.0);
              }
            `,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.frustumCulled = false;
          this.el.setObject3D("mesh", mesh);
        },
        remove() {
          this.el.removeObject3D("mesh");
        },
      });
    </script>
  </body>
</html>
